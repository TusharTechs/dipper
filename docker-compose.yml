# Dipper local stack. `docker compose up api` is enough for the engine and API.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DIPPER_CORS: http://localhost:3000
  hapi:
    # Local FHIR R4 server. The public OAH sandbox has been unreachable since 23 Sep 2026 (hl7-eu/oah#8).
    image: hapiproject/hapi:v8.2.0-1
    ports: ["8080:8080"]
    environment:
      hapi.fhir.fhir_version: R4
  db:
    # PostGIS for persistent cases (next step; the prototype API keeps cases in memory).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dipper
      POSTGRES_PASSWORD: dipper
      POSTGRES_DB: dipper
    ports: ["5432:5432"]
    profiles: ["persistence"]
