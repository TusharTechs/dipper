# Dipper local stack.
#   docker compose up --build            web app + API on http://localhost:8000 (API docs at /api/docs)
#   docker compose --profile fhir up     also a local HAPI FHIR R4 server; set FHIR_BASE_URL=http://hapi:8080/fhir
services:
  app:
    build:
      context: .
    ports: ["127.0.0.1:8000:8000"]   # local only; put a TLS reverse proxy in front for a real deployment
    environment:
      DIPPER_DEMO: ${DIPPER_DEMO:-1}           # scenario replay and demo sign-in; set 0 in production
      FHIR_BASE_URL: ${FHIR_BASE_URL:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - dipper-state:/app/state
    restart: unless-stopped
  hapi:
    # Local FHIR R4 server. The public OAH sandbox has been unreachable since 23 Sep 2026 (hl7-eu/oah#8).
    image: hapiproject/hapi:v8.2.0-1
    ports: ["127.0.0.1:8080:8080"]
    environment:
      hapi.fhir.fhir_version: R4
    profiles: ["fhir"]
volumes:
  dipper-state:
