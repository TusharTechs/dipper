[project]
name = "dipper"
version = "0.1.0"
description = "Bayesian source hunting for sewage pollution in urban streams (OneAquaHealth IEEE Hackathon 2026)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "networkx>=3.3",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dipper_engine", "src/dipper_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
